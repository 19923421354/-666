name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 描述你遇到的痛点或场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望的功能行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有想过其他实现方式？（可选）
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我可以参与实现这个功能（提 PR）
