name: Bug 反馈
description: 提交一个 Bug，帮助我们改进
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 设置页「关于」中显示的版本号
      placeholder: "例如 1.5.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - Android APK
        - 浏览器 (PWA)
        - 桌面端
        - 本地部署
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: 对话引擎
      options:
        - 内置 AI（本地模型）
        - 轻量对话
        - Ollama
        - OpenAI 兼容接口
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何触发这个 Bug？
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 应该发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有报错信息或截图，请附上
